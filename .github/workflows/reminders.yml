name: Recordatorios de entregas

on:
  schedule:
    - cron: "0 */3 * * *"
  workflow_dispatch: {}

jobs:
  reminders:
    runs-on: ubuntu-latest
    steps:
      - name: Comprobar entregas próximas
        run: |
          curl -sS --fail-with-body --retry 2 --retry-delay 15 -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            https://todo-uni.vercel.app/api/cron/reminders
